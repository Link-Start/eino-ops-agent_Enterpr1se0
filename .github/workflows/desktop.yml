name: Desktop packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - "cmd/**"
      - "internal/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            run_tests: true
            goos: linux
            goarch: amd64
            artifact: opsnerva-linux-x64
            paths: |
              web/src-tauri/target/release/bundle/appimage/*.AppImage
              web/src-tauri/target/release/bundle/deb/*.deb
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            run_tests: true
            goos: linux
            goarch: arm64
            artifact: opsnerva-linux-arm64
            paths: |
              web/src-tauri/target/release/bundle/appimage/*.AppImage
              web/src-tauri/target/release/bundle/deb/*.deb
          - name: Windows x64
            os: windows-latest
            run_tests: true
            artifact: opsnerva-windows-x64
            paths: web/src-tauri/target/release/bundle/nsis/*-setup.exe
          - name: Windows ARM64
            os: windows-11-arm
            run_tests: true
            artifact: opsnerva-windows-arm64
            paths: web/src-tauri/target/release/bundle/nsis/*-setup.exe
          - name: macOS ARM64
            os: macos-14
            run_tests: true
            goos: darwin
            goarch: arm64
            artifact: opsnerva-macos-arm64
            # Upload only the dmg. A .app bundle is a directory; recursive
            # artifact upload flattens Contents/* into release assets
            # (icon.icns, Info.plist, opsnerva, opsnerva-desktop).
            paths: web/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/setup@v2
        with:
          package-json-file: web/package.json
          runtime: node@22
          cache: true
          cache-dependency-path: web/pnpm-lock.yaml
          install: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri -> target

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Build web frontend
        run: pnpm run lint && pnpm run build
        working-directory: web

      - name: Test Go backend
        if: matrix.run_tests
        run: go test ./...

      - name: Compile Go backend
        if: ${{ !matrix.run_tests }}
        run: go test ./... -run '^$'

      - name: Build desktop package
        run: pnpm run desktop:build
        working-directory: web

      - name: Build server binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -buildvcs=false -trimpath -ldflags="-s -w" \
            -o dist/opsnerva-server-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/opsnerva

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: opsnerva-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/opsnerva-server-*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: opsnerva-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**
          generate_release_notes: true
          fail_on_unmatched_files: true
